<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghibli Retro Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/retro.css">
</head>
<body>
  <header class="window-outset">
    <h1 class="rainbow">Ghibli Retro</h1>
    <marquee behavior="scroll" direction="left">Welcome to the Ghibli Retro experience — a blend of classic UI and Studio Ghibli magic!</marquee>
  </header>

  <section class="hero window-outset">
    <img src="https://via.placeholder.com/800x400?text=Hero+Image" alt="Hero Image">
  </section>

  <section class="features">
    <div class="feature-card window-outset">
      <img src="https://via.placeholder.com/200?text=Asset+1" alt="Feature 1">
      <h2>Feature 1</h2>
    </div>
    <div class="feature-card window-outset">
      <img src="https://via.placeholder.com/200?text=Asset+2" alt="Feature 2">
      <h2>Feature 2</h2>
    </div>
    <div class="feature-card window-outset">
      <img src="https://via.placeholder.com/200?text=Asset+3" alt="Feature 3">
      <h2>Feature 3</h2>
    </div>
    <div class="feature-card window-outset">
      <img src="https://via.placeholder.com/200?text=Asset+4" alt="Feature 4">
      <h2>Feature 4</h2>
    </div>
    <div class="feature-card window-outset">
      <img src="https://via.placeholder.com/200?text=Asset+5" alt="Feature 5">
      <h2>Feature 5</h2>
    </div>
  </section>

  <footer class="window-outset">
    <p>&copy; 2026 Ghibli Retro — All rights reserved.</p>
  </footer>
</body>
</html>
